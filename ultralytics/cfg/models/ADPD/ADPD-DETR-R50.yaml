# ADPD-DETR: ResNet-50 student with P2 DDPM and four-scale detection.
#
# Purpose:
#   Keep the adaptive teacher's R50 + four-scale DEHF route, but replace
#   the expensive Reconstruction Head (RH) with a lightweight P2 mask head.
#   During KD, the full adaptive teacher supervises the student Difference Map,
#   Filtration Map, P2', output predictions and high-quality boxes.
#
# Main route:
#   Input -> ResNet50 backbone -> P2/P3/P4/P5
#   P2 -> Light Mask Head -> D_s/F_s -> Filtration + Reweighting -> P2'
#   P5 -> AIFI -> P5'
#   P2' + P3 + P4 + P5' -> DEHF (CFPIM/MSSF + PAN) -> RTDETRDecoder
#
# The student keeps the paper DGFE inference formula:
#   P2' = P2 * channel_att * filtration
# but no reconstructed image is generated at inference time.

nc: 1
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3
  - [-1, 1, Blocks, [64, BottleNeck, 3, 2, 'relu']] # 4 P2, stride 4
  - [-1, 1, Blocks, [128, BottleNeck, 4, 3, 'relu']] # 5 P3, stride 8
  - [-1, 1, Blocks, [256, BottleNeck, 6, 4, 'relu']] # 6 P4, stride 16
  - [-1, 1, Blocks, [512, BottleNeck, 3, 5, 'relu']] # 7 P5, stride 32

head:
  # RH-free DGFE student.
  # args: reduction, mask_hidden, mask_scale, detach_mask
  - [4, 1, PaperOWRTDMDGFERHFree, [16, 64, 1.0, False]] # 8 P2'

  # P5 -> AIFI -> P5'
  - [7, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 9
  - [-1, 1, AIFI, [1024, 8]] # 10
  - [-1, 1, Conv, [256, 1, 1]] # 11 P5'

  # Top-down CFPIM/MSSF: P5' + P4 -> P4_td
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 13
  - [[13, 12, 11], 1, Msfc, []] # 14
  - [-1, 3, RetBlockC3, [256, 1, 'chunk', 8]] # 15 P4_td
  - [-1, 1, Conv, [256, 1, 1]] # 16

  # Top-down CFPIM/MSSF: P4_td + P3 -> P3_td
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 17
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 18
  - [[18, 17, 16], 1, Msfc, []] # 19
  - [-1, 3, RetBlockC3, [256, 1, 'chunk', 8]] # 20 P3_td
  - [-1, 1, Conv, [256, 1, 1]] # 21

  # Top-down CFPIM/MSSF: P3_td + P2' -> P2_td
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 22
  - [8, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 23
  - [[23, 22, 21], 1, Msfc, []] # 24
  - [-1, 3, RetBlockC3, [256, 1, 'chunk', 8]] # 25 P2_td

  # Bottom-up PAN path.
  - [-1, 1, Conv, [256, 3, 2]] # 26
  - [[-1, 20], 1, Concat, [1]] # 27
  - [-1, 3, RetBlockC3, [256, 1, 'chunk', 8]] # 28 P3_out

  - [-1, 1, Conv, [256, 3, 2]] # 29
  - [[-1, 15], 1, Concat, [1]] # 30
  - [-1, 3, RetBlockC3, [256, 1, 'chunk', 8]] # 31 P4_out

  - [-1, 1, Conv, [256, 3, 2]] # 32
  - [[-1, 11], 1, Concat, [1]] # 33
  - [-1, 3, RetBlockC3, [256, 1, 'chunk', 8]] # 34 P5_out

  # Four-level decoder: P2_td, P3_out, P4_out, P5_out.
  - [[25, 28, 31, 34], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 6]] # 35
